@let documentValue = document();

<div class="mb-4 ml-2.5">
  <nuxeo-back-to-personal-button
    [path]="documentValue.path"
    [parentId]="documentValue.parentRef"
    [currentTitle]="title()"></nuxeo-back-to-personal-button>
</div>

<div class="flex flex-col gap-4">
  <h1 class="text-3xl font-semibold">{{ title() }}</h1>

  <div class="flex flex-col gap-6 lg:flex-row">
    <div class="min-h-[720px] w-full min-w-0 rounded-lg border border-slate-200 bg-slate-50 lg:flex-[2]"></div>
    <nuxeo-document-info-panel
      [document]="documentValue"
      [showAttachments]="false"
      [showDownloads]="false"
      (reloadDocument)="reloadDocument.emit()"></nuxeo-document-info-panel>
  </div>
</div>
