<div class="flex flex-col gap-4">
  <div class="rounded border border-gray-200 bg-white p-4">
    @if (valueRows().length) {
      <div class="mt-3">
        <nuxeo-case-list-table
          [shouldShowResults]="false"
          [isSettingsEnabled]="false"
          [tableItems]="valueRows()"
          [tableConfig]="inlineValueColumns"
          [defaultColumnOptions]="inlineValueColumnOptions"
          [loading]="false"
          [pageSize]="50"
          (updatedTableItems)="onInlineValuesChange($event)">
        </nuxeo-case-list-table>
      </div>
    } @else {
      <p class="mt-2 text-sm text-gray-500">Inga värden att redigera.</p>
    }
  </div>
</div>
