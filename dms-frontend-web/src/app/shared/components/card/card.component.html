<div class="rounded-2xl shadow-2xl">
  <div class="mx-2.5 py-1.5 pr-[30%]">
    <p class="text-primary pb-2 text-5xl font-bold decoration-solid">{{ value() }}</p>
    <p class="text-primary font-bold">{{ subtitle() }}</p>

    <p class="text-primary">
      @for (tag of tags(); track tag) {
        <span>[{{ tag }}]</span>
      }
    </p>
  </div>
</div>
