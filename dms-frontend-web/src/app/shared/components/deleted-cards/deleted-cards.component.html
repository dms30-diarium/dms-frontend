<div class="flex-2">
  <div
    class="grid [grid-template-columns:repeat(var(--colsSmall),_1fr)] gap-4 md:[grid-template-columns:repeat(var(--colsMedium),_1fr)] lg:[grid-template-columns:repeat(var(--cols),_1fr)]"
    [style.--cols]="columns()"
    [style.--colsSmall]="columns() - 2 > 0 ? columns() - 2 : 1"
    [style.--colsMedium]="columns() - 1 > 0 ? columns() - 1 : 1">
    @for (item of cards(); track item.uid) {
      <div class="rounded-lg border border-gray-200 bg-white p-4 shadow-sm" aria-hidden="true">
        <div class="flex h-full items-center justify-between">
          <div class="flex gap-4">
            <input
              (click)="$event.stopPropagation()"
              [checked]="selectedIds().includes(item.uid)"
              (change)="selectItem(item.uid)"
              type="checkbox"
              class="mt-1 h-5 w-5 self-center rounded border-gray-300 text-blue-600" />
            <div class="">
              <div class="text-primary mb-4 text-lg font-semibold">
                {{ item.title }}
              </div>
              <div>
                <span class="text-sm font-semibold break-words break-all whitespace-normal">Typ: </span>
                <span class="word-normal text-sm break-words hyphens-auto text-gray-500"> {{ item.type }}</span>
              </div>
              <div class="flex gap-1">
                <span class="shrink-0 text-sm font-semibold">Sökväg:</span>
                <span class="max-w-[150px] min-w-0 truncate text-sm text-gray-500" [title]="item.path">
                  {{ item.path }}
                </span>
              </div>
              <div>
                <span class="text-sm font-semibold break-words break-all whitespace-normal">Senast ändrad: </span>
                <span class="word-normal text-sm break-words hyphens-auto text-gray-500"> {{ item.lastModified }}</span>
              </div>
            </div>
          </div>
          <div>
            <nuxeo-image-button
              icon="Redo"
              text="Återställa"
              size="small"
              (buttonClick)="restoreSelectedFiles.emit(item.uid)"
              variation="function">
            </nuxeo-image-button>
            <digi-button
              (afOnClick)="deleteSelectedFiles.emit(item.uid)"
              [attr.af-size]="'small'"
              [attr.af-variation]="'function'"
              [attr.af-full-width]="false">
              <digi-icon-trash slot="icon" />
              Ta bort
            </digi-button>
          </div>
        </div>
      </div>
    }
  </div>
</div>
