<button [cdkMenuTriggerFor]="filterMenu" class="bg-primary flex items-center gap-2 rounded-lg px-3 py-1.5 text-white">
  Filters
  @if (hasSelected()) {
    <span class="text-primary ml-1 rounded-full bg-white px-2 py-0.5 text-xs font-semibold">
      {{ selectedCount() }}
    </span>
  }
</button>

<ng-template #filterMenu>
  <div cdkMenu class="min-w-[250px] rounded-lg border border-gray-200 bg-white p-3 shadow-lg">
    <input
      type="text"
      [ngModel]="searchTerm()"
      (ngModelChange)="searchTerm.set($event)"
      placeholder="Search..."
      class="mb-3 w-full rounded border px-2 py-1 text-sm outline-none focus:ring-2 focus:ring-blue-500" />

    @if (hasSelected()) {
      <button (click)="resetAll()" class="mb-3 text-xs text-red-600 hover:underline">Rensa</button>
    }
    <div class="flex max-h-[300px] flex-col gap-4 overflow-auto pr-1">
      @for (filter of filters(); track filter.name) {
        <div>
          <div class="text-sm font-semibold">{{ filter.name }}</div>
          <hr class="my-1 border-gray-200" />
          @for (opt of filteredOptions(filter.options); track opt.id) {
            <label class="flex cursor-pointer items-center gap-2 rounded px-2 py-1 text-sm hover:bg-gray-100">
              <input
                [type]="filter.filterType"
                [checked]="isChecked(filter.name, opt.id)"
                (click)="toggle(filter, opt.id)" />
              {{ opt.label }}
            </label>
          }
        </div>
      }
    </div>

    <div class="mt-3 flex justify-end">
      <button (click)="apply()" class="bg-primary rounded px-3 py-1 text-sm text-white hover:bg-blue-800">Apply</button>
    </div>
  </div>
</ng-template>
