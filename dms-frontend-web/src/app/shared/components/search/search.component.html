<div class="relative flex w-full max-w-md">
  <!-- Ícone de busca à esquerda -->
  <span class="pointer-events-none absolute inset-y-0 left-3 flex items-center">
    <lucide-angular [name]="iconSearch" class="h-4 w-4 text-slate-400"></lucide-angular>
  </span>

  <input
    #textInput
    [placeholder]="placeholderText()"
    (keyup.enter)="emit(textInput.value)"
    autocomplete="off"
    class="w-full rounded-l-lg border border-slate-300 bg-white py-1.5 pr-[40px] pl-9 text-sm placeholder:text-slate-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-500 focus:outline-none" />

  @if (textInput.value) {
    <button
      type="button"
      class="absolute inset-y-0 right-[88px] flex items-center px-2 text-slate-400 hover:text-slate-600"
      (click)="textInput.value = ''; emit('')"
      title="Rensa">
      <lucide-angular [name]="iconClear" class="h-4 w-4"></lucide-angular>
    </button>
  }

  <button
    type="button"
    class="bg-primary hover:bg-primary inline-flex items-center rounded-r-lg px-4 py-2 text-sm font-medium text-white shadow-sm transition focus:ring-2 focus:ring-blue-500 focus:outline-none"
    (click)="textInput.value ? emit(textInput.value) : ''">
    <lucide-angular [name]="iconSearch" class="h-4 w-4"></lucide-angular>
    <span class="ml-2">{{ buttonText() }}</span>
  </button>
</div>
